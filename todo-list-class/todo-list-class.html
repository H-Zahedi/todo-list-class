<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List Class</title>

    <link rel="stylesheet" href="todo-list-class.css">
</head>
<body>

    <div class="container">

        <!-- Todo List -->
        <ul id="todoList" class="list-group todos"></ul>

        <!-- Add Todo Form -->
        <form id="todoForm" class="add" autocomplete="off">

            <label for="username">
                Add New Todo...
            </label>

            <input
                type="text"
                class="form-control"
                id="username"
                name="add"
                placeholder="Enter a new todo..."
            >

            <button type="submit" id="addButton">
                Add To List
            </button>

            <button type="button" id="clearButton">
                Clear Todo List
            </button>

        </form>

    </div>

    <script src="todo-list-class.js"></script>

</body>
</html>
