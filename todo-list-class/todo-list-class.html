<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo list class</title>
    <link rel="stylesheet" href="./todo-list-class.css">
</head>
<body>
    <div class="container">

        <ul id="todoList" class="list-group todos mx-auto text-light">

        </ul>

        <form id="todoForm" class="add text-center my-4" autocomplete="off">
            <label for="username" class="text-light">
                Add New Todo...
            </label>

            <input
                type="text"
                class="form-control m-auto"
                id="username"
                name="add"
                placeholder="Enter a new todo..."
                required
            >

            <button type="submit" class="add-btn">
                Add to list
            </button>
        </form>

        <button id="clearButton" type="button" class="clear-btn">
            Clear all todos
        </button>

    </div>

    <script src="./todo-list-class.js"></script>
</body>
</html>
